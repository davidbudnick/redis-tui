name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        if: runner.os != 'Windows'
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run tests
        if: runner.os == 'Windows'
        run: go test -v ./...

      - name: Enforce 100% coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0

          while IFS= read -r line; do
              func=$(echo "$line" | awk '{print $2}')
              pct=$(echo "$line" | awk '{print $NF}' | tr -d '%')

              if [[ "$func" == "(statements)" ]]; then
                  continue
              fi

              if (( $(echo "$pct < 100.0" | bc -l) )); then
                  location=$(echo "$line" | awk '{print $1}')
                  file=$(echo "$location" | cut -d':' -f1)
                  line_num=$(echo "$location" | cut -d':' -f2)
                  
                  # Generate an inline PR annotation for the failure
                  echo "::error file=$file,line=$line_num::Function $func coverage is ${pct}%, required 100%"
                  FAILED=1
              fi
          done < <(go tool cover -func=coverage.out)

          if [[ $FAILED -eq 1 ]]; then
              echo "Coverage enforcement failed."
              exit 1
          fi

          echo "All functions at 100% coverage"

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  native-build:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build and smoke
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            ext=".exe"
          fi
          go build -ldflags "-s -w" -o "bin/redis-tui${ext}" ./
          "./bin/redis-tui${ext}" --version

  cross-device-update:
    name: Cross-device update (Ubuntu 26.04)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Ubuntu 26.04 test image
        run: docker build --load -f scripts/Dockerfile.cross-device -t redis-tui-cross-device scripts/

      - name: Reproduce EXDEV and verify copy fallback
        run: |
          docker run --rm \
            --tmpfs /tmp:exec,mode=1777,size=512m \
            -v "$PWD":/src \
            -w /src \
            -e CROSS_DEVICE_SRC=/tmp \
            -e CROSS_DEVICE_DEST=/opt/dest \
            -e REQUIRE_CROSS_DEVICE=1 \
            redis-tui-cross-device \
            sh scripts/test-cross-device-update.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          binary_name="redis-tui"
          if [ "$GOOS" = "windows" ]; then
            binary_name="${binary_name}.exe"
          fi
          go build -ldflags "-s -w" -o "bin/${binary_name}" ./

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: redis-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
